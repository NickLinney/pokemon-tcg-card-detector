[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-tcg-card-detector"
version = "0.0.0"
description = "Evidence-preserving local Pokémon TCG binder-page detector"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "NickLinneyDev"}]
dependencies = [
  "easyocr==1.7.2",
  "ImageHash==4.3.2",
  "jsonschema==4.25.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "rapidfuzz==3.14.1",
]

[project.optional-dependencies]
api = [
  "Flask==3.1.3",
  "gunicorn==26.2.0",
]
test = [
  "Flask==3.1.3",
  "pytest==8.4.2",
]

[project.scripts]
ptcg = "ptcg.cli:main"
ptcg-api = "ptcg.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
